name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Matches v1.0.0, v2.1.3-beta.1, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  # =============================================================================
  # VALIDATION - Ensure code quality before release
  # =============================================================================
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.7'

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

  # =============================================================================
  # CREATE GITHUB RELEASE
  # =============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}

          if [ -f CHANGELOG.md ]; then
            # Extract section between this version and next version/EOF
            NOTES=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | sed '$d' | tail -n +2)

            if [ -z "$NOTES" ]; then
              NOTES="Release $VERSION - See [CHANGELOG.md](CHANGELOG.md) for details"
            fi
          else
            NOTES="Release $VERSION"
          fi

          # Save to file for multiline support
          echo "$NOTES" > release_notes.md

          # Also output for other steps
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Determine if pre-release
        id: prerelease
        run: |
          TAG=${{ steps.version.outputs.tag }}
          if [[ "$TAG" =~ -[a-zA-Z] ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: terraform-gitlab-module-${{ steps.version.outputs.tag }}
          path: |
            **/*.tf
            **/*.md
            LICENSE
            .editorconfig
          retention-days: 90

  # =============================================================================
  # NOTIFY TERRAFORM REGISTRY (Optional)
  # =============================================================================
  notify-registry:
    name: Notify Terraform Registry
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{ !contains(github.ref, '-') }}  # Only stable releases
    steps:
      - name: Trigger Terraform Registry Webhook
        run: |
          if [ -n "${{ secrets.TF_REGISTRY_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.TF_REGISTRY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"tag\": \"${GITHUB_REF#refs/tags/}\", \"repository\": \"$GITHUB_REPOSITORY\"}"
          else
            echo "TF_REGISTRY_WEBHOOK_URL not configured, skipping"
          fi
        continue-on-error: true
