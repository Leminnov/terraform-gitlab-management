# OpenSpec project configuration.
# Docs: https://github.com/Fission-AI/OpenSpec
# `context` and `rules` are injected into `openspec instructions` for every
# artifact; keep them to what is specific to this module. Engineering
# standards are NOT repeated here: they live in the stores declared under
# references: below and every instruction set carries an index of them with
# the command to fetch the relevant one. AGENTS.md routes to the
# same stores outside the OpenSpec workflow. `mise run spec-setup` registers them.
schema: spec-driven

references:
  # `ref` pins the store checkout; scripts/openspec-setup.sh clones it and
  # warns when a registered checkout is on another commit. When a ref moves,
  # regenerate the standards index in AGENTS.md in the same commit.
  - id: quality
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/quality.git
    ref: v1.2.1
  - id: repository
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/repository.git
    ref: v1.2.1
  - id: terraform
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/terraform.git
    ref: v1.2.1
  - id: git
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/git.git
    ref: v1.2.1
  - id: gitlab
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/gitlab.git
    ref: v1.2.1
  - id: secrets
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/secrets.git
    ref: v1.2.1
  - id: openspec
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/openspec.git
    ref: v1.3.0

context: |
  Quality mandate: every artifact applies the non-negotiables of AGENTS.md
  (simple, efficient, secure, production-level) and cites the quality-store
  specs that decided something.

  Project: OpenTofu/Terraform module that manages GitLab CI/CD settings:
  group and project CI/CD variables, group deploy tokens, pipeline schedules
  and their variables, runners (gitlab_user_runner), and group and project
  access tokens. Variable, deploy-token and access-token inputs fan out over
  a `groups` / `projects` list, one resource per (entry, target). Published on
  GitLab (leminnov/terraform/modules/gitlab-management); consumers pin a git
  tag (?ref=vX.Y.Z). Apache-2.0.

  Stack: HCL only. required_version >= 1.11.0. Provider pinned with ~> in
  versions.tf: gitlabhq/gitlab ~> 18.11. Every tool is pinned in mise.toml.

  Layout: main.tf holds every resource, each labelled `this`; locals.tf
  flattens the fan-out inputs into maps keyed "<entry>_<target>";
  variables.tf is the whole input contract (map(object) inputs, optional()
  defaults, validation blocks for enums, formats and non-empty lists, enum
  sets in a locals block at its top); outputs.tf exposes IDs, summaries and,
  marked sensitive, values and tokens. tests/main.tftest.hcl = unit tests
  with a dummy gitlab provider and command = plan (no server).
  examples/basic and examples/complete must stay valid; examples/complete
  sets every input.

  Module-specific conventions (generic ones are standards in the referenced
  stores, fetched on demand): secret-bearing inputs (variable values,
  schedule variables) are not marked sensitive because for_each cannot
  iterate sensitive values, and tokens GitLab creates land in state, both
  documented in SECURITY.md; every output surfacing a token or a value is
  sensitive; the caller configures the gitlab provider; README input/output
  tables are generated by terraform-docs between BEGIN_TF_DOCS/END_TF_DOCS;
  CHANGELOG.md is generated by git-cliff from commit messages
  (mise run changelog), so the commit message is the changelog entry.

  Commands: tofu fmt -recursive; tofu init -backend=false && tofu validate;
  tflint --recursive; tofu test (unit); pre-commit run -a (also regenerates
  the README via terraform-docs); mise run spec-validate (openspec validate
  --all --strict).

  Standards: fetch the referenced-store specs listed in these instructions
  whose id matches the area touched, and cite the ones applied.

rules:
  proposal:
    - Name the gitlabhq/gitlab provider version (and GitLab server version when it matters) the change depends on, and what happens on older ones
    - Classify the change as semver major/minor/patch per terraform-versioning and list every input or output whose type, default or meaning changes
    - State what lands in state; a new secret-bearing input must follow terraform-security (write-only argument plus a *_wo_version companion), or justify why the provider offers none
  specs:
    - Write requirements against the module's observable contract - input shape, plan-time validation errors, resources and arguments produced, outputs, empty second plan - not against provider internals
    - Give every validation block a scenario with the rejected input, and every check block a scenario with the warned input
  design:
    - Name the resources and arguments used and the provider version that introduced them
    - Explain how the change avoids a perpetual diff (what GitLab reads back) and how existing state migrates (moved blocks, in-place update or forced replacement), including any change to the "<entry>_<target>" for_each keys
    - Keep provider {} and backend {} out of the module
  tasks:
    - Include unit tests in tests/main.tftest.hcl (a rejected-input run for every new validation) and examples/complete plus any example the change affects
    - Include tofu fmt -recursive, tofu validate, tflint --recursive, tofu test and pre-commit run -a (terraform-docs README regeneration)
    - Include README / SECURITY.md updates when the compatibility matrix or what lands in state changes, and a commit message fit for the git-cliff changelog with upgrade notes for anything breaking

operations:
  apply:
    guidance:
      - Apply the quality store (simplicity, efficiency, security, production-readiness) to every task; fetch terraform-code-style, terraform-variables and terraform-outputs from the terraform store before editing HCL; flag any deviation with a DEVIATION(<spec-id>) comment giving the reason
      - Run tofu fmt -recursive, tofu validate and tofu test after each task group and do not mark a task done while they fail
      - Never apply against a real GitLab unless the user asked; say explicitly when it was skipped
      - Report test and scanner output as-is, including failures
  archive:
    guidance:
      - Confirm the terraform-docs README block was regenerated before archiving when the module contract changed
      - Summarize which main specs changed and any requirement that was removed
