# OpenSpec project configuration.
# Docs: https://github.com/Fission-AI/OpenSpec
# `context` and `rules` are injected into `openspec instructions` for every
# artifact; keep them to what is specific to this module. Engineering
# standards are NOT repeated here: they live in the stores declared under
# references: below and every instruction set carries an index of them with
# the command to fetch the relevant one. AGENTS.md routes to the
# same stores outside the OpenSpec workflow. `mise run spec-setup` registers them.
schema: spec-driven

references:
  # `ref` pins the store checkout; scripts/openspec-setup.sh clones it and
  # warns when a registered checkout is on another commit. When a ref moves,
  # regenerate the standards index in AGENTS.md in the same commit.
  - id: quality
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/quality.git
    ref: v1.2.1
  - id: repository
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/repository.git
    ref: v1.2.1
  - id: terraform
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/terraform.git
    ref: v1.2.1
  - id: git
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/git.git
    ref: v1.2.1
  - id: gitlab
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/gitlab.git
    ref: v1.2.1
  - id: secrets
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/secrets.git
    ref: v1.2.1
  - id: openspec
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/openspec.git
    ref: v1.3.0

context: |
  Quality mandate: every artifact applies the non-negotiables of AGENTS.md
  (simple, efficient, secure, production-level) and cites the quality-store
  specs that decided something.

  Project: OpenTofu/Terraform module that creates a GitLab group and project
  tree under an existing parent group (parent_group_id, groups up to 7 levels,
  projects) with the gitlab-project-settings defaults and objects nested in
  each group and project, and manages GitLab CI/CD settings on existing ones:
  group and project CI/CD variables, group deploy tokens, pipeline schedules
  and their variables, runners (gitlab_user_runner), and group and project
  access tokens. The standalone variable, deploy-token and access-token inputs
  fan out over a `groups` / `projects` list, one resource per (entry, target). Published on
  GitLab (leminnov/terraform/modules/gitlab-management); consumers pin a git
  tag (?ref=vX.Y.Z). Apache-2.0.

  Stack: HCL only. required_version >= 1.11.0. Provider pinned with ~> in
  versions.tf: gitlabhq/gitlab ~> 19.5 (no write-only argument on any resource
  used here). Tested on gitlab.com. Every tool is pinned in mise.toml.

  Layout: resources, each labelled `this` (groups: level_1 to level_7, one
  block per depth), live in themed files listed in the header of main.tf:
  groups.tf, projects.tf, access.tf (with the moved block from
  gitlab_deploy_token), ci.tf, metadata.tf, premium.tf; locals.tf flattens the
  fan-out inputs into maps keyed "<entry>_<target>" and merges the objects
  nested in groups and projects into the same maps, keyed
  "<owner key>:<item key>" (standalone keys may not contain ":"); checks.tf
  holds the plan-time guardrails;
  variables.tf is the whole input contract (map(object) inputs, optional()
  defaults, validation blocks for enums, formats and non-empty lists, enum
  sets in a locals block at its top); outputs.tf exposes IDs, summaries and,
  marked sensitive, tokens (never a variable value). tests/*.tftest.hcl (main,
  groups, projects, nested, metadata, premium, guardrails) = unit tests with
  mock_provider "gitlab", numeric mock IDs and command = plan (no server).
  tests/integration/ = gitlab.com sandbox fixture run by run.sh in owner,
  least and upgrade (from v12.0.0) modes; it checks redaction, server-side
  results (owner mode also builds a small tree), an empty second plan and
  token revocation on destroy.
  examples/basic and examples/complete must stay valid; examples/complete
  sets every input and raises no warning.

  Module-specific conventions (generic ones are standards in the referenced
  stores, fetched on demand): variable and schedule variable values and
  webhook tokens reach the provider through sensitive() because for_each
  iterates the inputs (DEVIATION(terraform-variables)); they and every token
  GitLab creates land in state, listed in SECURITY.md; Premium-only settings
  default to {} or null so a Free namespace plans none of them; groups and
  projects are archived on destroy unless archive_on_destroy = false;
  pre-commit-terraform runs v1.109.3, above the terraform store's v1.109.1
  (DEVIATION(terraform-repo-precommit), latest stable toolchain); validations accept exactly what the
  provider accepts; the caller configures the gitlab provider; README
  input/output tables are generated by terraform-docs between
  BEGIN_TF_DOCS/END_TF_DOCS; CHANGELOG.md is curated by hand under
  "## [Unreleased]" with semver.

  Commands: tofu fmt -recursive; tofu init -backend=false && tofu validate;
  tflint --recursive; mise run test (unit); mise run test-integration
  (gitlab.com sandbox, only when asked); mise run scan (checkov, trivy,
  osv-scanner); pre-commit run -a (also regenerates the README via
  terraform-docs); mise run spec-validate (openspec validate --all --strict).

  Standards: fetch the referenced-store specs listed in these instructions
  whose id matches the area touched, and cite the ones applied.

rules:
  proposal:
    - Name the gitlabhq/gitlab provider version (and GitLab server version when it matters) the change depends on, and what happens on older ones
    - Classify the change as semver major/minor/patch per terraform-versioning and list every input or output whose type, default or meaning changes
    - State what lands in state; a new secret-bearing input must follow terraform-security (write-only argument plus a *_wo_version companion), or justify why the provider offers none
  specs:
    - Reuse the capability directories under openspec/specs (module-contract, groups, projects, repository-protection, access-management, ci-variables, deploy-tokens, deploy-keys, access-tokens, pipeline-schedules, runners, project-ci-settings, labels-and-badges, webhooks, premium-features, security-guardrails); add a new one only for a new module area
    - Write requirements against the module's observable contract - input shape, plan-time validation errors, resources and arguments produced, outputs, empty second plan - not against provider internals
    - Give every validation block a scenario with the rejected input, and every check block a scenario with the warned input
  design:
    - Name the resources and arguments used and the provider version that introduced them
    - Explain how the change avoids a perpetual diff (what GitLab reads back) and how existing state migrates (moved blocks, in-place update or forced replacement), including any change to the "<entry>_<target>" for_each keys
    - Keep provider {} and backend {} out of the module
  tasks:
    - Include unit tests in the tests/*.tftest.hcl file of the area (a rejected-input run for every new validation, a run per check), the integration fixture in tests/integration/ when GitLab is involved, and examples/complete plus any example the change affects
    - Include tofu fmt -recursive, tofu validate, tflint --recursive, mise run test and pre-commit run -a (terraform-docs README regeneration)
    - Include a CHANGELOG.md entry under "## [Unreleased]" with upgrade notes for anything breaking, and README / SECURITY.md updates when the compatibility table, a required role or what lands in state changes

operations:
  apply:
    guidance:
      - Apply the quality store (simplicity, efficiency, security, production-readiness) to every task; fetch terraform-code-style, terraform-variables and terraform-outputs from the terraform store before editing HCL; flag any deviation with a DEVIATION(<spec-id>) comment giving the reason
      - Run tofu fmt -recursive, tofu validate and mise run test after each task group and do not mark a task done while they fail
      - Never apply against a real GitLab unless the user asked; say explicitly when it was skipped
      - Report test and scanner output as-is, including failures
  archive:
    guidance:
      - Confirm the CHANGELOG Unreleased entry and the terraform-docs README block were updated before archiving when the module contract changed
      - Summarize which main specs changed and any requirement that was removed
