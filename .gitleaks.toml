# gitleaks configuration (secrets-detection): the default rules, no allowlist.
# A full-history scan with the default rules found nothing, so no exception is
# needed. Record a false positive here one by one ([[allowlists]] with the
# commit or path, a regex and its reason), never as a blanket path; a real
# secret is rotated and recorded in SECURITY.md instead.
[extend]
useDefault = true
