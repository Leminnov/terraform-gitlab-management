[settings]
auto_install = true

[tools]
pre-commit = '4.3'
git-cliff = '2.7.0'
age = '1.2'
sops = '3.11'
shfmt = '3.12'
yamlfmt = '0.20'
opentofu = '1.11'
terraform-docs = '0.21.0'
tflint = '0.56.0'

[tasks.changelog]
description = "Update CHANGELOG.md (fetches all tags first)"
run = '''
git-cliff --config .cliff.toml --output CHANGELOG.md
'''
