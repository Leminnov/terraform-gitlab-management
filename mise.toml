# Same mise as CI (.gitlab/global.yml MISE_VERSION).
min_version = '2026.10.17'

[settings]
auto_install = true

[tools]
pre-commit = '4.7.0'
git-cliff = '2.14.2'
python = '3.14.9'
# IaC toolchain. The module supports OpenTofu >= 1.11; CI also tests the
# minimum version (see .gitlab/release.yml).
opentofu = '1.13.2'
terraform-docs = '0.24.0'
tflint = '0.64.0'
# Security scanners run by pre-commit (terraform_checkov / terraform_trivy),
# `mise run scan` and CI (osv-scanner).
trivy = '0.76.1'
checkov = '3.3.30'
osv-scanner = '2.7.0'
# Secret scanner run by the pre-commit hook (same version as its `rev`) and by
# the security:gitleaks CI job.
gitleaks = '8.30.1'
# Runtime of the openspec CLI and required by mise's npm backend to install
# it; same major as the node image of .gitlab/specs.yml.
node = '24.22.1'
# Spec-driven development CLI (openspec/, .claude/skills/openspec-*). The
# skills shell out to `openspec`, so it must be on PATH. Keep equal to
# OPENSPEC_VERSION in .gitlab/global.yml.
"npm:@fission-ai/openspec" = '1.14.3'

[tasks.rm-cache]
description = "Remove .terramate-cache directories"
run = 'find . -type d -name ".terramate-cache" -prune -exec rm -rf {} \;'

[tasks.rm-terraform]
description = "Remove .terraform directories"
run = 'find . -type d -name ".terraform" -prune -exec rm -rf {} \;'

[tasks.rm-lock]
description = "Remove .terraform.lock.hcl files"
run = 'find . -type f -name ".terraform.lock.hcl" -prune -exec rm -rf {} \;'

[tasks.rm-all]
description = "Remove all generated/cached terraform artifacts (cache, .terraform, lock files, state files)"
run = '''
find . -type d -name ".terramate-cache" -prune -exec rm -rf {} \;
find . -type d -name ".terraform" -prune -exec rm -rf {} \;
find . -type f -name ".terraform.lock.hcl" -prune -exec rm -rf {} \;
find . -type f -name "terraform.tfstate*" -prune -exec rm -rf {} \;
'''

# CHANGELOG.md is curated by hand. git-cliff only drafts the commit list since
# the last tag, to help write the next section; it never rewrites the file.
[tasks.changelog-draft]
description = "Print commits since the last tag as a starting point for the next CHANGELOG.md section"
run = 'git-cliff --config .cliff.toml --unreleased --strip all'

[tasks.changelog-verify]
description = "Check CHANGELOG.md has a dated section for a version: mise run changelog-verify 13.0.0"
run = 'scripts/changelog.sh verify'

[tasks.release]
description = "Cut a release on main: mise run release <patch|minor|major|X.Y.Z> [--push] (see scripts/release.sh)"
run = 'scripts/release.sh prepare'

[tasks.spec-validate]
description = "Validate OpenSpec specs and change proposals (openspec validate --all --strict)"
run = 'openspec validate --all --strict'

# The stores are the `references:` of openspec/config.yaml; registered once per
# machine, reusing a ghorg checkout or cloning into ${OPENSPEC_STORES_DIR:-~/openspec}.
[tasks.spec-setup]
description = "Register the OpenSpec stores referenced by openspec/config.yaml (clone if needed), then openspec doctor"
run = 'scripts/openspec-setup.sh'

[tasks.test]
description = "Unit tests (mock provider, no server)"
run = 'tofu test'

[tasks.scan]
description = "Security scanners (same as CI)"
run = '''
set -eu
checkov -d . --quiet --compact --skip-path '\.terraform'
trivy config --quiet --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --ignorefile .trivyignore.yaml --skip-dirs '**/.terraform' .
trivy fs --quiet --exit-code 1 --scanners vuln,secret --skip-dirs '**/.terraform' .
# 128 = no package manifests (Terraform lock files are not scanned).
rc=0; osv-scanner scan source -r . || rc=$?
if [ "$rc" -ne 0 ] && [ "$rc" -ne 128 ]; then exit "$rc"; fi
'''

# Needs the sandbox group and project and their two tokens (TESTING.md); pass
# the tokens for the command only, from your secret store.
[tasks.test-integration]
description = "Integration tests against the GitLab sandbox: owner, least privilege, and upgrade from v12.0.0 (see TESTING.md)"
run = '''
set -eu
: "${GITLAB_TOKEN:?set GITLAB_TOKEN to the sandbox owner token (TESTING.md)}"
: "${GITLAB_TOKEN_LEAST:?set GITLAB_TOKEN_LEAST to the sandbox Maintainer token (TESTING.md)}"
: "${SANDBOX_GROUP_ID:?set SANDBOX_GROUP_ID}" "${SANDBOX_PROJECT_ID:?set SANDBOX_PROJECT_ID}"
MODE=owner tests/integration/run.sh
GITLAB_TOKEN="$GITLAB_TOKEN_LEAST" MODE=least tests/integration/run.sh
MODE=upgrade tests/integration/run.sh
'''
