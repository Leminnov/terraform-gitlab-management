# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% for release in releases -%}
    {%- if release.version -%}
        ## [{{ release.version | trim_start_matches(pat="v") }}] - {{ release.timestamp | date(format="%Y-%m-%d") }}
        {% for commit in release.commits %}
        {%- if commit.scope -%}
            - **{{ commit.scope }}:** {{ commit.message }}
        {%- else -%}
            - {{ commit.message }}
        {%- endif -%}
        {% endfor -%}
    {%- endif -%}
{% endfor %}
"""
# remove the leading and trailing whitespace from the template
trim = true
# changelog footer
footer = ""

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = false
# filter out the commits that are not conventional
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# skip unreleased commits
skip_tags = ""
include_path = []
exclude_path = []
# Only include commits that are part of a tag (skip unreleased)
tag_pattern = "v[0-9].*"
# regex for preprocessing the commit messages
commit_preprocessors = []
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out the commits that are not matched by commit parsers
filter_commits = true
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "newest"
# limit the number of commits included in the changelog.
# limit_commits = 42

# Skip merge commits
[[git.commit_parsers]]
message = "^Merge.*"
skip = true

# Skip CHANGELOG related commits
[[git.commit_parsers]]
message = ".*CHANGELOG.*"
skip = true

# Skip changelog related commits
[[git.commit_parsers]]
message = ".*[Cc]hangelog.*"
skip = true

# Skip chglog related commits
[[git.commit_parsers]]
message = ".*chglog.*"
skip = true

# Skip CI skip commits
[[git.commit_parsers]]
message = ".*\\[skip ci\\].*"
skip = true

# Skip CI skip commits (alternative format)
[[git.commit_parsers]]
message = ".*\\[ci skip\\].*"
skip = true

# Skip "Updated CHANGELOG" commits
[[git.commit_parsers]]
message = "^Updated CHANGELOG.*"
skip = true
