variables:
  TOOLBOX_PYTHON_IMAGE: "registry.gitlab.com/${GITLAB_GROUP_PATH}/containers/toolbox:v5.2.0"

pre-commit:
  image: $TOOLBOX_PYTHON_IMAGE
  rules:
  - when: always
  # Run the job only when the file `.pre-commit-config.yaml` exist in the repo
  - exists:
      - .pre-commit-config.yaml
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
  # Enable Caching for pre-commit
  cache:
    key: pre-commit
    paths:
      - $CI_PROJECT_DIR/.cache
  script:
    - >
      if [ $SKIP_OSV_SCAN == true ]; then

        echo "Skipping OSV Scanner: $SKIP_OSV_SCAN"
        exit 0
      fi
    #osv-scanner
    - osv-scanner -r .
    # Trigger pre-commit checks
    - pre-commit run -a
