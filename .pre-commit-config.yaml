default_install_hook_types:
  - pre-commit
  - pre-merge-commit
  - pre-push
  - prepare-commit-msg
  - commit-msg
  - post-checkout
  - post-commit
  - post-merge
  - post-rewrite

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: "Check YAML"
        description: "Verify YAML syntax"
        args:
          - --allow-multiple-documents
      - id: check-json
      - id: detect-private-key
      - id: trailing-whitespace
        name: "Trailing Whitespaces"
        description: "Trims trailing whitespaces"
      - id: check-merge-conflict
        name: "MergeRequests conflicts"
        description: "Check for files that contain merge conflict strings."
        args:
          - --assume-in-merge
      - id: end-of-file-fixer
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # DEVIATION(terraform-repo-precommit): v1.109.3, the latest stable patch, above the
  # store's v1.109.1 (maintainer decision: latest stable toolchain).
  - repo: https://github.com/antonbabenko/pre-commit-terraform.git
    rev: v1.109.3
    hooks:
      # Pin the binary: with both tofu and terraform on PATH the hooks would
      # otherwise prefer terraform, which cannot reuse tofu-initialised dirs.
      - id: terraform_fmt
        args: [--hook-config=--tf-path=tofu]
      - id: terraform_docs
        args: [--hook-config=--tf-path=tofu]
      - id: terraform_tflint
        args: [--hook-config=--tf-path=tofu]
      - id: terraform_validate
        args: [--hook-config=--tf-path=tofu]
      # Scanner binaries are pinned in mise.toml (`mise install`).
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--compact
          - --args=--skip-path=\.terraform
      - id: terraform_trivy
        args:
          - --args=--misconfig-scanners=terraform
          - --args=--ignorefile=__GIT_WORKING_DIR__/.trivyignore.yaml
          - --args=--severity=MEDIUM,HIGH,CRITICAL
          - --args=--skip-dirs="**/.terraform"
