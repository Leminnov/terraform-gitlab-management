validate:opentofu:
  stage: validate
  timeout: 10m
  # The image's entrypoint is `tofu`; clear it so GitLab can run the script with sh.
  image:
    name: ghcr.io/opentofu/opentofu:${TOFU_IMAGE_VERSION}
    entrypoint: [""]
  # Minimum supported version and the mise.toml pin, exact tags (terraform-repo-mise).
  parallel:
    matrix:
      - TOFU_IMAGE_VERSION: ["1.11.14", "1.13.2"]
  needs: []
  script:
    - tofu init -backend=false
    - tofu validate
    - tofu fmt -check -recursive
    # Unit suite: mock provider, no server and no token (terraform-testing).
    - tofu test

validate:examples:
  stage: validate
  timeout: 10m
  image:
    name: ghcr.io/opentofu/opentofu:${TOFU_IMAGE_VERSION}
    entrypoint: [""]
  # Same matrix as validate:opentofu.
  parallel:
    matrix:
      - TOFU_IMAGE_VERSION: ["1.11.14", "1.13.2"]
  needs: []
  script:
    - |
      set -eu
      for d in examples/*/; do
        echo "::: validating $d"
        (cd "$d" && tofu init -backend=false && tofu validate)
      done

validate:tflint:
  stage: validate
  timeout: 10m
  # The image's entrypoint is `tflint`; clear it so GitLab can run the script with sh.
  image:
    name: ghcr.io/terraform-linters/tflint:${TFLINT_VERSION}
    entrypoint: [""]
  needs: []
  before_script:
    - tflint --init
  script:
    - tflint --recursive

security:trivy:
  stage: validate
  timeout: 10m
  image:
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  needs: []
  variables:
    TRIVY_EXIT_CODE: "1"
    TRIVY_SEVERITY: "MEDIUM,HIGH,CRITICAL"
    TRIVY_IGNORE_UNFIXED: "true"
  script:
    # Misconfigurations in the Terraform code
    - trivy config --exit-code $TRIVY_EXIT_CODE --severity $TRIVY_SEVERITY --ignorefile .trivyignore.yaml --skip-dirs "**/.terraform" .
    # Secrets and vulnerable dependencies anywhere in the repository
    - trivy fs --exit-code $TRIVY_EXIT_CODE --severity $TRIVY_SEVERITY --scanners vuln,secret --skip-dirs "**/.terraform" .
    # CycloneDX SBOM; on a release tag it is published to the generic package
    # registry so the release asset link never expires (gitlab-releases).
    - trivy fs --format cyclonedx --output sbom.cdx.json --skip-dirs "**/.terraform,examples" .
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        apk add --no-cache curl >/dev/null
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file sbom.cdx.json \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/sbom/$CI_COMMIT_TAG/sbom.cdx.json"
      fi
  # Release SBOMs live in the package registry; branch and merge-request SBOMs
  # are only kept for review.
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - sbom.cdx.json

# Secret scan with gitleaks (secrets-detection): the commits of a merge request,
# and the full history on the weekly pipeline schedule. The pre-commit hook
# only sees staged files, and trivy fs covers the tree of every other pipeline.
security:gitleaks:
  stage: validate
  timeout: 10m
  image:
    name: ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}
    entrypoint: [""]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      set -eu
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        gitleaks git --redact --no-banner --exit-code 1 --log-opts="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA" .
      else
        gitleaks git --redact --no-banner --exit-code 1 .
      fi

# Any annotated vX.Y.Z tag is releasable when it is on main and CHANGELOG.md
# has a dated non-empty section for it; `mise run release` is the usual way to
# produce one (it also points the README examples at the tag), a hand-made tag
# that meets both checks is accepted too.
verify:changelog:
  stage: validate
  image: alpine:3.24
  timeout: 5m
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache bash git
  script:
    - scripts/release.sh check "$CI_COMMIT_TAG"

create:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:${RELEASE_CLI_VERSION}
  timeout: 5m
  interruptible: false
  # Every validation, test and scan job of a tag pipeline (gitlab-releases).
  needs:
    - pre-commit
    - validate:specs
    - validate:opentofu
    - validate:examples
    - validate:tflint
    - security:trivy
    - verify:changelog
    - test:integration:gitlab
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    # Release notes are the tag's curated CHANGELOG.md section.
    - scripts/changelog.sh notes "$CI_COMMIT_TAG" > release_notes.md
  release:
    name: "Release $CI_COMMIT_TAG"
    description: release_notes.md
    tag_name: $CI_COMMIT_TAG
    assets:
      links:
        - name: "Source (tar.gz)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.tar.gz"
        - name: "Source (zip)"
          url: "$CI_PROJECT_URL/-/archive/$CI_COMMIT_TAG/$CI_PROJECT_NAME-$CI_COMMIT_TAG.zip"
        - name: "CHANGELOG"
          url: "$CI_PROJECT_URL/-/blob/$CI_COMMIT_TAG/CHANGELOG.md"
        - name: "SBOM (CycloneDX)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/sbom/$CI_COMMIT_TAG/sbom.cdx.json"
