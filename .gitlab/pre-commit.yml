pre-commit:
  stage: validate
  image: ubuntu:24.04
  timeout: 20m
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
      exists:
        - .pre-commit-config.yaml
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
    MISE_DATA_DIR: $CI_PROJECT_DIR/.cache/mise
  cache:
    key: "pre-commit-$CI_COMMIT_REF_SLUG"
    paths:
      - $CI_PROJECT_DIR/.cache/pre-commit
      - $CI_PROJECT_DIR/.cache/mise
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git curl ca-certificates python3
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise trust --yes
    # Installs every tool pinned in mise.toml, including the scanners.
    - mise install
    - eval "$(mise activate bash)"
    # git-cliff requires at least one tag to exist
    - git tag | grep -q . || git tag v0.0.0
  script:
    - |
      if [ "${SKIP_OSV_SCAN:-false}" != "true" ]; then
        # Exit code 128 means "no package sources found": this repository has
        # no lock files osv-scanner understands (Terraform locks are ignored).
        rc=0; osv-scanner scan source -r . || rc=$?
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 128 ]; then exit "$rc"; fi
      else
        echo "Skipping OSV Scanner: SKIP_OSV_SCAN=$SKIP_OSV_SCAN"
      fi
    - pre-commit run -a -v
